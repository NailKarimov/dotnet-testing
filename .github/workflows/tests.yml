name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # nightly, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # publish the reports to the gh-pages branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build (warnings are errors)
        run: |
          mkdir -p site/diag
          dotnet build tests/BookingApp.Tests 2>&1 | tee site/diag/build.log
          exit "${PIPESTATUS[0]}"

      - name: Install Chromium for Playwright
        run: pwsh tests/BookingApp.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Tests (API in memory, Reqnroll, Playwright UI)
        id: tests
        continue-on-error: true
        run: |
          dotnet test tests/BookingApp.Tests --no-build \
            --logger "junit;LogFilePath=$PWD/results/junit.xml;MethodFormat=Class;FailureBodyFormat=Verbose" \
            --logger "console;verbosity=normal" \
            --collect "XPlat Code Coverage" --results-directory results 2>&1 | tee site/diag/test.log
          exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, collections
          try:
              root = ET.parse('results/junit.xml').getroot()
          except Exception as e:
              print('No results:', e); raise SystemExit
          by = collections.Counter(); bad = collections.Counter()
          for tc in root.iter('testcase'):
              cls = tc.get('classname', '').split('.')[-1]
              by[cls] += 1
              if tc.find('failure') is not None or tc.find('error') is not None: bad[cls] += 1
          print('### Tests\n\n| Class | Tests | Failed |\n| --- | ---: | ---: |')
          for c in sorted(by): print(f'| {c} | {by[c]} | {bad[c]} |')
          print(f'\n**{sum(by.values())} tests, {sum(bad.values())} failed**')
          PY

      - uses: actions/setup-node@v7
        if: always()
        with:
          node-version: 22

      - uses: actions/setup-java@v6 # Allure CLI needs Java
        if: always()
        with:
          distribution: temurin
          java-version: 21

      - name: Build the site
        if: always()
        run: |
          mkdir -p allure-results
          cp results/junit.xml allure-results/ 2>/dev/null || true
          git fetch origin gh-pages --depth=1 && git worktree add gh-pages-old origin/gh-pages || true
          if [ -d gh-pages-old/history ]; then cp -r gh-pages-old/history allure-results/; fi
          npx --yes allure-commandline@2.46.1 generate allure-results -o site/report --clean || true
          if [ -d site/report ]; then cp -r site/report/. site/ && rm -rf site/report; fi
          cov=$(find results -name 'coverage.cobertura.xml' | head -1)
          if [ -n "$cov" ]; then cp "$cov" site/diag/coverage.cobertura.xml; fi
          find tests -path '*traces/*.zip' -exec cp {} site/diag/ \; || true
          for f in docs/*.html; do if [ -f "$f" ]; then cp "$f" site/; fi; done
          if [ -d gh-pages-old/mutants ]; then cp -r gh-pages-old/mutants site/; fi

      - name: Publish to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  mutants:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and install Chromium
        run: |
          dotnet build tests/BookingApp.Tests
          pwsh tests/BookingApp.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Every planted bug must fail the suite
        run: |
          mkdir -p out/mutants
          python3 scripts/mutants.py | tee out/mutants/result.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Publish the result next to the reports
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: out
          keep_files: true
